<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 76" width="250" height="76">
  <defs>
    <style>
      .wordmark {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 500;
        font-size: 26px;
        fill: #1a2b4a;
        letter-spacing: 2.5px;
      }
      .tagline {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 500;
        font-size: 8px;
        fill: #1a2b4a;
        letter-spacing: 1.1px;
      }
    </style>
  </defs>

  <!-- Cubo -->
  <g id="hexagon">
    <!-- Linee posteriori (oro) - tutte dal centro ai vertici, cap butt -->
    <line x1="26" y1="36" x2="26" y2="14" stroke="#d4af37" stroke-width="1" stroke-linecap="butt"/>
    <line x1="26" y1="36" x2="6" y2="48" stroke="#d4af37" stroke-width="1" stroke-linecap="butt"/>
    <line x1="26" y1="36" x2="46" y2="48" stroke="#d4af37" stroke-width="1" stroke-linecap="butt"/>

    <!-- Linee frontali (blu) -->
    <line x1="26" y1="36" x2="26" y2="58" stroke="#1a2b4a" stroke-width="1.7" stroke-linecap="round"/>
    <line x1="26" y1="36" x2="6" y2="24" stroke="#1a2b4a" stroke-width="1.7" stroke-linecap="round"/>
    <line x1="26" y1="36" x2="46" y2="24" stroke="#1a2b4a" stroke-width="1.7" stroke-linecap="round"/>

    <!-- Esagono -->
    <polygon points="26,14 46,24 46,48 26,58 6,48 6,24" fill="none" stroke="#1a2b4a" stroke-width="1.7" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark + tagline -->
  <text x="60" y="34" class="wordmark">AMBITVS</text>
  <text x="60" y="48" class="tagline">EUROPEAN OBSERVATORY</text>
  <text x="60" y="58" class="tagline">ON INTEREST GROUPS</text>
</svg>