
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <style>
      .wordmark {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 500;
        font-size: 20px;
        fill: #1a2b4a;
        letter-spacing: 2px;
      }
      .tagline {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 500;
        font-size: 5.5px;
        fill: #1a2b4a;
        letter-spacing: 0.8px;
      }
    </style>
  </defs>

  <g id="hexagon">
    <line x1="30" y1="30" x2="30" y2="14" stroke="#d4af37" stroke-width="0.9" stroke-linecap="round"/>
    <line x1="27.8" y1="34" x2="14" y2="41" stroke="#d4af37" stroke-width="0.9" stroke-linecap="round"/>
    <line x1="32.2" y1="34" x2="46" y2="41" stroke="#d4af37" stroke-width="0.9" stroke-linecap="round"/>

    <line x1="30" y1="30" x2="30" y2="46" stroke="#1a2b4a" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="30" y1="30" x2="14" y2="21" stroke="#1a2b4a" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="30" y1="30" x2="46" y2="21" stroke="#1a2b4a" stroke-width="1.4" stroke-linecap="round"/>

    <polygon points="30,14 46,21 46,39 30,46 14,39 14,21" fill="none" stroke="#1a2b4a" stroke-width="1.4" stroke-linejoin="round"/>
  </g>

  <text x="58" y="27" class="wordmark">AMBITVS</text>
  <text x="58" y="37" class="tagline">EUROPEAN OBSERVATORY</text>
  <text x="58" y="44" class="tagline">ON INTEREST GROUPS</text>
</svg>