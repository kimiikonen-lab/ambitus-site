baseURL = 'https://ambitus-observatory.org/'
languageCode = 'it-it'
title = 'Ambitus Observatory'
theme = 'PaperMod'

[params]
  # Modifica questo testo con la descrizione del tuo sito
  description = "Un osservatorio per ..."
  
  # L'autore di default per i post
  author = "Luca"

  # Colore principale del tema (puoi scegliere 'light', 'dark', o 'auto')
  defaultTheme = "auto"
  
  # Mostra il pulsante per tornare in alto
  ShowToC = true 
  ShowBreadCrumbs = true

  [params.profileMode]
    enabled = true
    title = "Ambitus Observatory"
    subtitle = "Osservatorio Indipendente."
    
    # Questo è il percorso dell'immagine del profilo (la aggiungeremo dopo)
    imageUrl = ""
    imageWidth = 120
    imageHeight = 120
    imageTitle = "Ambitus Logo"

    # Puoi aggiungere i tuoi link social qui
    [[params.profileMode.buttons]]
      name = "Email"
      url = "mailto:info@ambitus-observatory.org"
