baseURL = 'https://ambitus-observatory.org/'
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
title = 'Ambitus'
theme = 'PaperMod'

# Disabilita la generazione dei tassonomi se non ti servono
disableKinds = ['taxonomy', 'term']

[params]
    env = 'production'
    defaultTheme = 'light'
    disableThemeToggle = false
    disableLangToggle = false
    ShowShareButtons = true
    ShowReadingTime = true

    [params.label]
        icon = "/logo-compact.svg"
        iconHeight = 48

    [[params.socialIcons]]
        name = "email"
        url = "mailto:info@ambitus-observatory.org"

# ============================================================
# LINGUA INGLESE (default)
# ============================================================
[languages.en]
    contentDir = "content/en"
    label = "English"
    locale = "en-US"
    languageCode = "en-us"
    weight = 1
    title = "Ambitus"
    description = 'European Observatory on Interest Groups'

    [languages.en.params.homeInfoParams]
        Title = "Ambitus"
        Content = "European Observatory on Interest Groups. An independent research center dedicated to the scientific analysis and methodological study of interest relations within the European Union."

    [languages.en.menu]
      [[languages.en.menu.main]]
        name = "Home"
        url = "/"
        weight = 10

      [[languages.en.menu.main]]
        name = "Menu"
        url = "#"
        weight = 20

        [[languages.en.menu.main]]
          name = "Publications"
          url = "/publications/"
          parent = "Menu"
          weight = 1

        [[languages.en.menu.main]]
          name = "Indices"
          url = "/indices/"
          parent = "Menu"
          weight = 2

        [[languages.en.menu.main]]
          name = "The Method"
          url = "/method/"
          parent = "Menu"
          weight = 3

        [[languages.en.menu.main]]
          name = "About"
          url = "/about/"
          parent = "Menu"
          weight = 4

        [[languages.en.menu.main]]
          name = "Contact"
          url = "/contact/"
          parent = "Menu"
          weight = 5

# ============================================================
# LINGUA ITALIANA
# ============================================================
[languages.it]
    contentDir = "content/it"
    label = "Italiano"
    locale = "it-IT"
    languageCode = "it-it"
    weight = 2
    title = "Ambitus"
    description = 'Osservatorio Europeo sui Gruppi di Interesse'

    [languages.it.params.homeInfoParams]
        Title = "Ambitus"
        Content = "Osservatorio Europeo sui Gruppi di Interesse. Un centro di ricerca indipendente dedicato all'analisi scientifica e allo studio metodologico delle relazioni di interesse all'interno dell'Unione Europea."

    [languages.it.menu]
      [[languages.it.menu.main]]
        name = "Home"
        url = "/"
